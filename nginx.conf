server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(mp4|webm|glb|gltf|png|jpg|jpeg|webp|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
}
